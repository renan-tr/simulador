<!DOCTYPE HTML>
<!--
Developed by @renan-tr
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assembly Simulator</title>

  <style>
	* {
	  box-sizing: border-box;
	}
	
	/* Create three equal columns that floats next to each other */
	.column {
	  float: left;
	  width: 33.33%;
	  padding: 0px;
	  height: 75vh;
	  overflow: auto
	}
	
	/* Clear floats after the columns */
	.row:after {
	  content: "";
	  display: table;
	  clear: both;
	}
	
	textarea
	{
	  height: 99%;
	  width: 98%;
	  padding:1%;
	  border:3px solid #999999;
	}
	.boxsizingBorder
	{
	  border:1px solid #999999;
	  margin:0px 0;
	  padding:3px;
	}
	.tablebody {
	  height: 85%;
	  overflow: auto
	}
	</style>
</head>
<body>
 
	<h2>Z01 Assembly Simulator</h2>

	<form id="form">
	
		<div class="row">
			<div class="column" style="background-color:#aaa;">
				<textarea name="message" rows="25" id="textarea">; Code starts here</textarea>
			</div>
			<div class="column" style="background-color:#bbb;">
				<h3>RAM</h3>
			<div class="tablebody">
			<table id="tabela"></table>  
			</div> 
			</div>
			<div class="column" style="background-color:#ccc;">
			<b>Last executed line:</b>
			<label id="last_line"></label>
			<p style="font-size:16px; "> <b>Registers:</b></p>
				<table>
					<tr>
					  <td><b>Reg D</b></td>
					  <td><label id="regD_value"></label></td>
					</tr>
					<tr>
					  <td><b>Reg A</b></td>
					  <td><label id="regA_value"></label></td>
					</tr>
				</table>  
				<br>
			<p style="font-size:16px; "> <b>SWs</b></p>
			<input type="checkbox" id="SW10" name="SW10" value="SW10">
			<input type="checkbox" id="SW9" name="SW9" value="SW9">
			<input type="checkbox" id="SW8" name="SW8" value="SW8">
			<input type="checkbox" id="SW7" name="SW7" value="SW7">
			<input type="checkbox" id="SW6" name="SW6" value="SW6">
			<input type="checkbox" id="SW5" name="SW5" value="SW5">
			<input type="checkbox" id="SW4" name="SW4" value="SW4">
			<input type="checkbox" id="SW3" name="SW3" value="SW3">
			<input type="checkbox" id="SW2" name="SW2" value="SW2">
			<input type="checkbox" id="SW1" name="SW1" value="SW1">
			<p style="font-size:16px; "> <b>LEDs</b></p>
			<input type="checkbox" id="LED10" name="LED10" value="LED10" disabled="True">
			<input type="checkbox" id="LED9" name="LED9" value="LED9" disabled="True">
			<input type="checkbox" id="LED8" name="LED8" value="LED8" disabled="True">
			<input type="checkbox" id="LED7" name="LED7" value="LED7" disabled="True">
			<input type="checkbox" id="LED6" name="LED6" value="LED6" disabled="True">
			<input type="checkbox" id="LED5" name="LED5" value="LED5" disabled="True">
			<input type="checkbox" id="LED4" name="LED4" value="LED4" disabled="True">
			<input type="checkbox" id="LED3" name="LED3" value="LED3" disabled="True">
			<input type="checkbox" id="LED2" name="LED2" value="LED2" disabled="True">
			<input type="checkbox" id="LED1" name="LED1" value="LED1" disabled="True">
			<p style="font-size:16px; "> <b>LCD</b></p>
			<canvas id="CanvasLCD" width="320" height="240" style="border:1px solid #d3d3d3;"></canvas>
			</div>
		  </div>
		
		<br><br>
		<input type="button" id="Run" value="Run" onclick="run_code()"/>
		<input type="button" id="Line" value="Line" onclick="run_line()"/>	
		<input type="button" id="Reset" value="Reset" onclick="reset_values()"/>	
	  </form>

    <script src="js/assembly.js"></script>

</body>
</html>
