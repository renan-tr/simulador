<head>

<body>
 
	<h2>ULA</h2>

	<form id="form">
		<div class="row">
			<div class="column">
				<table>
					<tr>
						<td><b>X</b></td>
						<td><input type="textfield" id="X" name="X" value="0000000000000000" onchange="update_values()"></label></td>
					</tr>
					<tr>
						<td><b>Y</b></td>
						<td><input type="textfield" id="Y" name="Y" value="0000000000000000" onchange="update_values()"></label></td>
					</tr>
				</table> 
			</div>
			<div class="column">
				<table>
					<tr>
						<td><b>zx</b></td>
						<td><input type="checkbox" id="zx" name="zx" onchange="update_values()"></label></td>
					</tr>
					<tr>
						<td><b>zy</b></td>
						<td><input type="checkbox" id="zy" name="zy" onchange="update_values()"></label></td>
					</tr>
				</table> 
			</div>
			<div class="column">
				<table>
					<tr>
						<td><b>nx</b></td>
						<td><input type="checkbox" id="nx" name="nx" onchange="update_values()"></label></td>
					</tr>
					<tr>
						<td><b>ny</b></td>
						<td><input type="checkbox" id="ny" name="ny" onchange="update_values()"></label></td>
					</tr>
				</table> 
			</div>
			<div class="column">
				<table>
					<tr>
						<td><b>f</b></td>
						<td><input type="checkbox" id="f" name="f" onchange="update_values()"></label></td>
					</tr>
					<tr>
						<td><b>no</b></td>
						<td><input type="checkbox" id="no" name="no" onchange="update_values()"></label></td>
					</tr>
				</table> 
			</div>
			<div class="column">
				<table>
					<tr>
						<td><b>zr</b></td>
						<td><input type="checkbox" id="zr" name="zr" disabled="true"></label></td>
					</tr>
					<tr>
						<td><b>ng</b></td>
						<td><input type="checkbox" id="ng" name="ng" disabled="true"></label></td>
					</tr>
				</table> 
			</div>
		</div>
		<br>
		<br>
		<br><br><br>
		<div class="container">
			<img src="assets/img/ula_v2.png" style="width:70%;">
			<div class="xinput"><label id="X_input">0000000000000000</label></div>
			<div class="yinput"><label id="Y_input">0000000000000000</label></div>
			<div class="zx_out"><label id="zx_out">0x0000</label></div>
			<div class="zy_out"><label id="zy_out">0x0000</label></div>
			<div class="nx_out"><label id="nx_out">0x0000</label></div>
			<div class="ny_out"><label id="ny_out">0x0000</label></div>
			<div class="and_out"><label id="and_out">0x0000</label></div>
			<div class="add_out"><label id="add_out">0x0000</label></div>
			<div class="mux_out"><label id="mux_out">0x0000</label></div>
			<div class="no_out"><label id="no_out">0x0000</label></div>

			<div class="nx"><label id="nx_in">0</label></div>
			<div class="ny"><label id="ny_in">0</label></div>
			<div class="zx"><label id="zx_in">0</label></div>
			<div class="zy"><label id="zy_in">0</label></div>
			<div class="f"><label id="f_in">0</label></div>
			<div class="no"><label id="no_in">0</label></div>
			<div class="zr"><label id="zr_out">1</label></div>
			<div class="ng"><label id="ng_out">0</label></div>
		</div> 
	</form>
	
	<script src="js/ula.js"></script>
